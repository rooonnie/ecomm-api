spring:
  application:
    name: ecomm-api
  datasource:
    url: jdbc:h2:file:./data/ecomm-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080

ecomm:
  jwt:
    secret: "ecomm-api-local-jwt-secret-key-min-32b"
    expiration-ms: 86400000
